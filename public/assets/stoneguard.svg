<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stoneguardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A9A9A9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#696969;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main body -->
  <rect x="60" y="60" width="80" height="100" fill="url(#stoneguardGrad)" rx="5"/>
  
  <!-- Head -->
  <rect x="70" y="40" width="60" height="40" fill="#A9A9A9" rx="3"/>
  
  <!-- Eyes -->
  <rect x="80" y="48" width="12" height="16" fill="#4169E1" rx="2"/>
  <rect x="108" y="48" width="12" height="16" fill="#4169E1" rx="2"/>
  <rect x="82" y="50" width="3" height="5" fill="#000"/>
  <rect x="110" y="50" width="3" height="5" fill="#000"/>
  
  <!-- Armor plating -->
  <rect x="65" y="75" width="70" height="8" fill="#505050" opacity="0.8"/>
  <rect x="65" y="90" width="70" height="8" fill="#505050" opacity="0.8"/>
  <rect x="65" y="105" width="70" height="8" fill="#505050" opacity="0.8"/>
  <rect x="65" y="120" width="70" height="8" fill="#505050" opacity="0.8"/>
  
  <!-- Shield emblem -->
  <path d="M 100 60 L 115 75 L 115 90 L 100 100 L 85 90 L 85 75 Z" fill="#FFD700" opacity="0.7"/>
  
  <!-- Spikes on shoulders -->
  <polygon points="55,80 45,65 55,70" fill="#696969"/>
  <polygon points="145,80 155,65 145,70" fill="#696969"/>
  
  <!-- Stone cracks -->
  <path d="M 70 65 L 75 80 L 70 95" stroke="#505050" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M 130 65 L 125 80 L 130 95" stroke="#505050" stroke-width="1" fill="none" opacity="0.5"/>
  
  <!-- Glow -->
  <rect x="60" y="60" width="80" height="100" fill="none" stroke="#4169E1" stroke-width="2" opacity="0.3" rx="5"/>
</svg>