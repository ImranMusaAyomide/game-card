<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="armatulaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2691E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Body -->
  <ellipse cx="100" cy="110" rx="45" ry="55" fill="url(#armatulaGrad)"/>
  
  <!-- Head -->
  <circle cx="100" cy="60" r="35" fill="url(#armatulaGrad)"/>
  
  <!-- Eyes -->
  <circle cx="90" cy="50" r="5" fill="#FFD700"/>
  <circle cx="110" cy="50" r="5" fill="#FFD700"/>
  <circle cx="90" cy="50" r="2" fill="#000"/>
  <circle cx="110" cy="50" r="2" fill="#000"/>
  
  <!-- Mouth -->
  <path d="M 95 65 Q 100 70 105 65" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Armor Plates -->
  <rect x="80" y="90" width="40" height="12" fill="#4A4A4A" opacity="0.7" rx="2"/>
  <rect x="75" y="108" width="50" height="10" fill="#696969" opacity="0.7" rx="2"/>
  <rect x="80" y="125" width="40" height="12" fill="#4A4A4A" opacity="0.7" rx="2"/>
  
  <!-- Shield Pattern -->
  <polygon points="100,75 115,95 85,95" fill="#FFD700" opacity="0.6"/>
  
  <!-- Glow effect -->
  <circle cx="100" cy="110" r="55" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.3"/>
</svg>